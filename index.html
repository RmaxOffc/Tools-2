<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>RMAX · VISUAL GENERATOR</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #030712;
      --surface-dark: rgba(12, 20, 35, 0.8);
      --border-glow: rgba(56, 189, 248, 0.25);
      --primary-neon: #38bdf8;
      --accent-cyan: #22d3ee;
      --text-dim: #9ca3af;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(
          circle at 20% 10%,
          #0b1424 0%,
          #010314 95%
        );

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1.5rem;

      position: relative;

      color: #e2e8f0;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;

      top: -15%;
      left: -10%;

      width: 80vw;
      height: 80vh;

      background:
        radial-gradient(
          circle at 30% 40%,
          rgba(6, 182, 212, 0.12) 0%,
          transparent 70%
        );

      filter: blur(90px);

      z-index: 0;

      pointer-events: none;
    }

    .main-wrapper {
      position: relative;

      z-index: 10;

      width: 100%;
      max-width: 520px;

      display: flex;
      flex-direction: column;

      gap: 2rem;
    }

    /* NAVBAR */

    .rmax-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 0.3rem;
    }

    .logo-block {
      display: flex;
      align-items: center;

      gap: 0.7rem;
    }

    .logo-img-wrapper {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 0 20px
        rgba(59, 130, 246, 0.6);

      border:
        1.5px solid
        rgba(56, 189, 248, 0.4);

      transition: 0.3s;
    }

    .logo-img-wrapper img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .logo-text {
      font-family: 'Poppins', sans-serif;

      font-weight: 700;

      font-size: 1.7rem;

      letter-spacing: -0.5px;

      background:
        linear-gradient(
          to right,
          #ffffff,
          #bae6fd
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 20px
        rgba(59, 130, 246, 0.5);
    }

    .nav-links {
      display: flex;

      gap: 1.8rem;
    }

    .nav-links a {
      font-size: 0.8rem;

      font-weight: 600;

      color: #94a3b8;

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: 0.8px;

      transition: 0.2s;

      border-bottom:
        1.5px solid transparent;

      padding-bottom: 3px;
    }

    .nav-links a:hover {
      color: #7dd3fc;

      border-bottom-color: #38bdf8;
    }

    /* GLASS CARD */

    .glass-card {
      background:
        rgba(12, 20, 35, 0.65);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border:
        1px solid
        rgba(56, 189, 248, 0.14);

      border-radius: 2rem;

      padding: 2rem 1.8rem;

      box-shadow:
        0 30px 50px -20px
        rgba(0, 0, 0, 0.8),

        0 0 0 1px
        rgba(37, 99, 235, 0.2);

      transition: all 0.25s ease;
    }

    /* IMAGE VIEWPORT */

    .visual-viewport {
      width: 100%;

      aspect-ratio: 1 / 1.1;

      background:
        rgba(0, 0, 0, 0.45);

      border-radius: 1.5rem;

      margin-bottom: 1.8rem;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(59, 130, 246, 0.25);

      overflow: hidden;

      position: relative;

      transition: 0.3s;
    }

    .visual-viewport.active-border {
      border-color:
        rgba(34, 211, 238, 0.6);

      box-shadow:
        0 0 28px
        rgba(6, 182, 212, 0.25);
    }

    .placeholder-block {
      text-align: center;

      color: #64748b;
    }

    .placeholder-block i {
      font-size: 2.6rem;

      margin-bottom: 0.8rem;

      opacity: 0.5;

      color: #38bdf8;
    }

    .placeholder-block p {
      font-weight: 500;

      font-size: 0.9rem;

      color: #7c8aa0;
    }

    .loader-spin {
      width: 48px;
      height: 48px;

      border:
        3px solid
        rgba(56, 189, 248, 0.15);

      border-top-color: #22d3ee;
      border-right-color: #3b82f6;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #generatedImage {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: none;

      border-radius: 1.5rem;
    }

    /* INPUT */

    .input-field {
      position: relative;

      margin-bottom: 1.2rem;
    }

    .input-field i {
      position: absolute;

      left: 18px;
      top: 50%;

      transform: translateY(-50%);

      color: #5f7b9c;

      font-size: 0.95rem;
    }

    .input-field input {
      width: 100%;

      background:
        rgba(5, 10, 23, 0.7);

      border:
        1.5px solid
        rgba(71, 146, 255, 0.25);

      border-radius: 1rem;

      padding:
        0.9rem
        1.1rem
        0.9rem
        3rem;

      font-size: 0.9rem;

      color: #f0f4ff;

      outline: none;

      transition: 0.2s;

      backdrop-filter: blur(8px);

      font-weight: 500;
    }

    .input-field input:focus {
      border-color: #38bdf8;

      box-shadow:
        0 0 18px
        rgba(37, 99, 235, 0.5);
    }

    /* QUICK TAGS */

    .quick-prompts {
      display: flex;

      flex-wrap: wrap;

      gap: 0.6rem;

      margin-bottom: 1.8rem;
    }

    .prompt-tag {
      background:
        rgba(30, 41, 59, 0.5);

      border:
        1px solid
        rgba(59, 130, 246, 0.2);

      padding:
        0.45rem
        1rem;

      border-radius: 2rem;

      font-size: 0.7rem;

      font-weight: 600;

      color: #b0c4de;

      cursor: pointer;

      transition: 0.2s;

      backdrop-filter: blur(4px);

      user-select: none;
    }

    .prompt-tag:hover {
      background: #1e3a5f;

      border-color: #38bdf8;

      color: white;

      box-shadow:
        0 0 14px
        rgba(37, 99, 235, 0.4);
    }

    /* BUTTON */

    .action-btn {
      width: 100%;

      padding: 0.9rem;

      border-radius: 1rem;

      font-weight: 700;

      font-size: 0.9rem;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0.6rem;

      border: none;

      cursor: pointer;

      transition: 0.25s;

      letter-spacing: 0.3px;
    }

    .btn-generate {
      background:
        rgba(15, 23, 42, 0.8);

      border:
        1px solid
        rgba(56, 189, 248, 0.5);

      color: #e0f2fe;

      box-shadow:
        0 8px 20px -6px
        #2563eb;

      backdrop-filter: blur(8px);
    }

    .btn-generate:hover {
      background: #1e3a8a;

      border-color: #7dd3fc;

      box-shadow:
        0 0 26px
        #3b82f6;
    }

    .btn-generate:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .btn-download {
      background: transparent;

      border:
        1px solid
        rgba(34, 211, 238, 0.3);

      color: #bae6fd;

      margin-top: 0.8rem;

      display: none;
    }

    .btn-download:hover {
      background:
        rgba(6, 182, 212, 0.1);

      border-color: #22d3ee;
    }

    .rmax-footer {
      text-align: center;

      font-size: 0.7rem;

      color: #4b5563;

      margin-top: 0.8rem;

      font-weight: 500;
    }

    .rmax-footer span {
      color: #38bdf8;

      font-weight: 700;
    }

    /* RESPONSIVE */

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .glass-card {
        padding: 1.5rem 1.2rem;
      }

      .logo-text {
        font-size: 1.4rem;
      }

      .nav-links {
        gap: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="main-wrapper">

    <!-- NAVBAR -->

    <nav class="rmax-nav">

      <div class="logo-block">

        <div class="logo-img-wrapper">

          <img
            src="https://files.catbox.moe/5gzg9h.jpg"
            alt="RMAX Logo"
            loading="eager"
          >

        </div>

        <span class="logo-text">
          RMAX
        </span>

      </div>

      <div class="nav-links">
        <a href="#">Hub</a>
        <a href="#">Tools</a>
        <a href="#">Lab</a>
      </div>

    </nav>


    <!-- MAIN CARD -->

    <div class="glass-card">

      <!-- IMAGE VIEWPORT -->

      <div
        class="visual-viewport"
        id="viewport"
      >

        <div
          class="placeholder-block"
          id="placeholderContent"
        >

          <i class="fas fa-cube"></i>

          <p>
            Visual ready to render
          </p>

        </div>


        <div
          class="loader-spin"
          id="loader"
        ></div>


        <img
          id="generatedImage"
          alt="RMAX Visual"
        >

      </div>


      <!-- INPUT -->

      <div class="input-field">

        <i class="fas fa-terminal"></i>

        <input
          type="text"
          id="promptInput"
          placeholder="Describe your visual concept..."
          autocomplete="off"
        >

      </div>


      <!-- QUICK PROMPTS -->

      <div class="quick-prompts">

        <span
          class="prompt-tag"
          data-prompt="Cyberpunk Neon City"
        >
          ⚡ Cyberpunk
        </span>


        <span
          class="prompt-tag"
          data-prompt="Futuristic Blue Interface"
        >
          🌀 Futuristic
        </span>


        <span
          class="prompt-tag"
          data-prompt="Abstract Dark Waves"
        >
          🌊 Abstract
        </span>


        <span
          class="prompt-tag"
          data-prompt="Minimalist Tech Logo"
        >
          🪶 Minimal
        </span>

      </div>


      <!-- GENERATE BUTTON -->

      <button
        class="action-btn btn-generate"
        id="generateBtn"
      >

        <i
          class="fas fa-wand-magic-sparkles"
        ></i>

        GENERATE VISUAL

      </button>


      <!-- DOWNLOAD BUTTON -->

      <button
        class="action-btn btn-download"
        id="downloadBtn"
      >

        <i
          class="fas fa-download"
        ></i>

        SAVE ASSET

      </button>


      <!-- FOOTER -->

      <div class="rmax-footer">

        <span>RMAX</span>

        VISUAL LAB · v1.0

      </div>

    </div>

  </div>


  <script>
    (() => {

      const promptInput =
        document.getElementById("promptInput");

      const generateBtn =
        document.getElementById("generateBtn");

      const downloadBtn =
        document.getElementById("downloadBtn");

      const viewport =
        document.getElementById("viewport");

      const placeholder =
        document.getElementById("placeholderContent");

      const loader =
        document.getElementById("loader");

      const generatedImg =
        document.getElementById("generatedImage");


      let currentImageUrl = "";


      /*
        LOGO FALLBACK
      */

      const logoImg =
        document.querySelector(
          ".logo-img-wrapper img"
        );

      logoImg.addEventListener(
        "error",
        function () {

          this.style.display = "none";

          const wrapper =
            this.parentElement;

          wrapper.style.background =
            "linear-gradient(135deg, #2563eb, #06b6d4)";

          wrapper.style.display = "flex";

          wrapper.style.alignItems =
            "center";

          wrapper.style.justifyContent =
            "center";

          wrapper.innerHTML = `
            <i
              class="fas fa-bolt"
              style="
                color:#0a0a0a;
                font-size:1.2rem;
              "
            ></i>
          `;
        }
      );


      /*
        QUICK PROMPTS
      */

      document
        .querySelectorAll(".prompt-tag")
        .forEach(tag => {

          tag.addEventListener(
            "click",
            function () {

              const promptText =
                this.getAttribute(
                  "data-prompt"
                );

              if (promptText) {

                promptInput.value =
                  promptText;

                promptInput.focus();
              }
            }
          );

        });


      /*
        GENERATE IMAGE
      */

      async function generateVisual() {

        const text =
          promptInput.value.trim();


        if (!text) {

          promptInput.focus();

          return;
        }


        /*
          LOADING STATE
        */

        generateBtn.disabled = true;

        generateBtn.innerHTML = `
          <i
            class="fas fa-circle-notch fa-spin"
          ></i>
          PROCESSING...
        `;


        downloadBtn.style.display =
          "none";


        placeholder.style.display =
          "none";


        generatedImg.style.display =
          "none";


        generatedImg.src = "";


        loader.style.display =
          "block";


        viewport.classList.remove(
          "active-border"
        );


        try {

          /*
            Timestamp untuk menghindari cache
          */

          const cacheBust =
            Date.now();


          /*
            REQUEST KE BACKEND SENDIRI

            /generate dijalankan oleh server.js
            iqc-canvas dijalankan di sana
          */

          const apiUrl =
            `/generate?text=${encodeURIComponent(text)}&time=09:45&_=${cacheBust}`;


          const response =
            await fetch(apiUrl, {
              cache: "no-store"
            });


          if (!response.ok) {

            let message =
              "Connection lost";

            try {

              const data =
                await response.json();

              message =
                data.message ||
                message;

            } catch (e) {}


            throw new Error(
              message
            );
          }


          /*
            Ambil hasil PNG
          */

          const blob =
            await response.blob();


          const imageUrl =
            URL.createObjectURL(blob);


          /*
            Hapus URL gambar lama
          */

          if (
            currentImageUrl &&
            currentImageUrl.startsWith("blob:")
          ) {

            URL.revokeObjectURL(
              currentImageUrl
            );
          }


          currentImageUrl =
            imageUrl;


          /*
            TAMPILKAN GAMBAR
          */

          generatedImg.onload =
            function () {

              loader.style.display =
                "none";


              generatedImg.style.display =
                "block";


              viewport.classList.add(
                "active-border"
              );


              generateBtn.disabled =
                false;


              generateBtn.innerHTML = `
                <i
                  class="fas fa-rotate-right"
                ></i>
                REGENERATE
              `;


              downloadBtn.style.display =
                "flex";
            };


          generatedImg.onerror =
            function () {

              throw new Error(
                "Gagal menampilkan gambar"
              );
            };


          generatedImg.src =
            imageUrl;


        } catch (error) {

          console.error(
            "Generate error:",
            error
          );


          loader.style.display =
            "none";


          generatedImg.style.display =
            "none";


          placeholder.style.display =
            "block";


          placeholder.innerHTML = `
            <i
              class="fas fa-exclamation-circle"
              style="color:#ef4444;"
            ></i>

            <p
              style="color:#f87171;"
            >
              ${escapeHTML(
                error.message ||
                "Connection lost"
              )}
            </p>
          `;


          generateBtn.disabled =
            false;


          generateBtn.innerHTML = `
            <i
              class="fas fa-redo"
            ></i>
            RETRY
          `;


          viewport.classList.remove(
            "active-border"
          );
        }
      }


      /*
        ESCAPE HTML
      */

      function escapeHTML(value) {

        const div =
          document.createElement("div");

        div.textContent = value;

        return div.innerHTML;
      }


      /*
        GENERATE CLICK
      */

      generateBtn.addEventListener(
        "click",
        generateVisual
      );


      /*
        DOWNLOAD
      */

      downloadBtn.addEventListener(
        "click",
        function () {

          if (!currentImageUrl) {
            return;
          }


          const originalText =
            downloadBtn.innerHTML;


          downloadBtn.innerHTML = `
            <i
              class="fas fa-spinner fa-spin"
            ></i>
            SAVING...
          `;


          try {

            const a =
              document.createElement("a");


            a.href =
              currentImageUrl;


            a.download =
              `RMAX_visual_${Date.now()}.png`;


            document.body.appendChild(a);


            a.click();


            document.body.removeChild(a);

          } catch (error) {

            console.error(
              "Download error:",
              error
            );

          } finally {

            setTimeout(() => {

              downloadBtn.innerHTML =
                originalText;

            }, 500);
          }
        }
      );


      /*
        ENTER KEY
      */

      promptInput.addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {

            event.preventDefault();

            generateVisual();
          }
        }
      );


    })();
  </script>

</body>
</html>
